version: "2"
type: backend
tech_stack:
  - TypeScript
  - Node.js
  - Hono Framework
  - Better Auth
  - Drizzle ORM
  - PostgreSQL (Supabase)
  - Postgres.js
features:
  - name: Health Check API
    description: Root status endpoint to check server availability
    files:
      - server/index.ts
    endpoints:
      - method: GET
        path: /
        description: Health check returning status string
        auth_required: false
        response_schema:
          "200": string

  - name: Authentication API
    description: Better-Auth authentication endpoints for user signup, login, session validation, and logout
    files:
      - server/auth.ts
      - server/index.ts
    endpoints:
      - method: POST
        path: /api/auth/sign-up/email
        description: Register a new user with name, email, and password
        auth_required: false
        request_schema:
          body:
            name: string
            email: string
            password: string
        response_schema:
          "200": object
          "400": Validation error
      - method: POST
        path: /api/auth/sign-in/email
        description: Authenticate existing user with email and password
        auth_required: false
        request_schema:
          body:
            email: string
            password: string
        response_schema:
          "200": object
          "400": Invalid credentials
      - method: GET
        path: /api/auth/get-session
        description: Retrieve current user session from session cookie
        auth_required: false
        response_schema:
          "200": object
      - method: POST
        path: /api/auth/sign-out
        description: Invalidate current user session
        auth_required: true
        response_schema:
          "200": object
      - method: GET
        path: /api/check-username/:username
        description: Check if a username is available or taken
        auth_required: false
        response_schema:
          "200":
            available: boolean

  - name: User Profile API
    description: Manage user profile information, favorite categories, and statistics
    files:
      - server/index.ts
      - server/db/schema.ts
    endpoints:
      - method: GET
        path: /api/me
        description: Get current user profile, streak data, and total XP
        auth_required: true
        response_schema:
          "200":
            id: string
            name: string
            username: string
            email: string
            currentStreak: number
            maxStreak: number
            totalXp: number
            favoriteCategories: string
            streakAtRisk: boolean
            gracePeriodUntil: string
          "401": Unauthorized
      - method: PUT
        path: /api/me
        description: Update profile name, username, or favorite categories
        auth_required: true
        request_schema:
          body:
            name: string
            username: string
            favoriteCategories: array
        response_schema:
          "200": object
          "400": Validation error or username already taken
          "401": Unauthorized

  - name: Quests Management API
    description: CRUD endpoints for daily quests, completion toggle, XP awarding, streak calculation, and history
    files:
      - server/index.ts
      - server/db/schema.ts
    endpoints:
      - method: GET
        path: /api/quests
        description: Get all active quests for the current user (auto-resets completed status if on a new day)
        auth_required: true
        response_schema:
          "200": array
          "401": Unauthorized
      - method: POST
        path: /api/quests
        description: Create a new daily quest
        auth_required: true
        request_schema:
          body:
            title: string
            timeGoalMinutes: number
            category: string
        response_schema:
          "201": object
          "400": Validation error
          "401": Unauthorized
      - method: PUT
        path: /api/quests/:id
        description: Update an existing quest title, duration, or category
        auth_required: true
        request_schema:
          body:
            title: string
            timeGoalMinutes: number
            category: string
        response_schema:
          "200": object
          "401": Unauthorized
          "404": Quest not found
      - method: DELETE
        path: /api/quests/:id
        description: Soft-delete or archive a quest
        auth_required: true
        response_schema:
          "200":
            success: boolean
          "401": Unauthorized
          "404": Quest not found
      - method: POST
        path: /api/quests/:id/check
        description: Complete quest for today, calculate XP gain (+10 XP minimum, streak bonuses, grace period recovery), and update user streak
        auth_required: true
        response_schema:
          "200":
            completed: boolean
            xpGained: number
            streakBonus: boolean
            gracePeriodRestored: boolean
            newStreak: number
            totalXp: number
          "401": Unauthorized
          "404": Quest not found
      - method: GET
        path: /api/quests/:id/history
        description: Retrieve completion log history for a specific quest
        auth_required: true
        response_schema:
          "200": array
          "401": Unauthorized

  - name: Leaderboard API
    description: Global and friends ranking leaderboard based on total XP and current streak
    files:
      - server/index.ts
    endpoints:
      - method: GET
        path: /api/leaderboard
        description: Retrieve top ranked users (supports ?tab=global and ?tab=friends)
        auth_required: true
        response_schema:
          "200":
            tab: string
            leaderboard: array
          "401": Unauthorized

  - name: Friends System API
    description: Search users, send friend requests, list pending requests, and respond (accept/reject)
    files:
      - server/index.ts
      - server/db/schema.ts
    endpoints:
      - method: GET
        path: /api/friends/search
        description: Search users by username or name (query param ?q=...)
        auth_required: true
        response_schema:
          "200": array
          "401": Unauthorized
      - method: POST
        path: /api/friends/request
        description: Send a friend request to a target user
        auth_required: true
        request_schema:
          body:
            targetUserId: string
        response_schema:
          "201": object
          "400": Cannot add self or already friends
          "401": Unauthorized
      - method: GET
        path: /api/friends/requests
        description: List incoming pending friend requests for current user
        auth_required: true
        response_schema:
          "200": array
          "401": Unauthorized
      - method: POST
        path: /api/friends/respond
        description: Accept or reject an incoming friend request
        auth_required: true
        request_schema:
          body:
            requestId: string
            action: string
        response_schema:
          "200": object
          "400": Invalid action
          "401": Unauthorized
      - method: GET
        path: /api/friends
        description: List current user's accepted friends
        auth_required: true
        response_schema:
          "200": array
          "401": Unauthorized

  - name: Achievements API
    description: Fetch unlocked badges and achievements for user
    files:
      - server/index.ts
    endpoints:
      - method: GET
        path: /api/achievements
        description: Retrieve list of unlocked achievements
        auth_required: true
        response_schema:
          "200": array
          "401": Unauthorized

  - name: Daily Cron Maintenance API
    description: Background maintenance endpoint to check streaks at risk and expire overdue grace periods
    files:
      - server/index.ts
    endpoints:
      - method: POST
        path: /api/cron/daily
        description: Daily midnight cron job to mark streaks at risk and zero out unrecovered streaks
        auth_required: false
        response_schema:
          "200":
            success: boolean
            streaksUpdated: number
known_limitations: []
