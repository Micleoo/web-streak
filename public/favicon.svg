<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="flameCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle matching the dashboard & navbar logo -->
  <rect width="32" height="32" rx="8" fill="url(#flameGrad)" />

  <!-- Inner highlight for glass/3D effect -->
  <rect x="1" y="1" width="30" height="15" rx="7" fill="#ffffff" fill-opacity="0.12" />

  <!-- Bara Flame Icon in center (Matching Lucide Flame) -->
  <g transform="translate(4, 4)" filter="url(#glow)">
    <path 
      d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" 
      fill="url(#flameCore)" 
      stroke="#ffffff" 
      stroke-width="1" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>
</svg>